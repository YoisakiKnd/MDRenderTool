# Include in nginx's http context and set the deployment root.
map $uri $mdrt_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /var/www/mdrt/dist;

    add_header Cache-Control $mdrt_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    # Uncomment if your Nginx build includes the ngx_brotli module:
    # brotli on;
    # brotli_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
